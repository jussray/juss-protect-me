name: Model One CI
on:
  push:
    branches: [main, 'security/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install Chromium for desktop and mobile Playwright
        run: npx playwright install --with-deps chromium
      - name: Verify public front door and closed enrollment in local Worker
        run: npx playwright test --config playwright.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: model-one-mobile-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
